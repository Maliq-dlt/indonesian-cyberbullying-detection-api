name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend CI (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cyber_user
          POSTGRES_PASSWORD: cyber_password
          POSTGRES_DB: cyberbullying_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r cyberbullying_api/requirements.txt
        pip install pytest pytest-cov

    - name: Run tests with pytest
      env:
        ENV: test
        API_KEY: test_api_key_for_ci_pipeline_run
        PG_URL: postgresql://cyber_user:cyber_password@localhost:5432/cyberbullying_db
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest cyberbullying_api/tests/ --cov=cyberbullying_api --cov-report=xml

  frontend-build:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint code
      run: |
        cd frontend
        npm run lint

    - name: Run frontend unit tests
      run: |
        cd frontend
        npm run test

    - name: Build production bundle
      run: |
        cd frontend
        npm run build
