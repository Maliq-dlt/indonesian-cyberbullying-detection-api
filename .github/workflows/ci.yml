name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend CI (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cyber_user
          POSTGRES_PASSWORD: cyber_password
          POSTGRES_DB: cyberbullying_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r cyberbullying_api/requirements.txt
        pip install pytest pytest-cov ruff

    - name: Run Ruff Linter & Formatter checks
      run: |
        ruff check cyberbullying_api/
        ruff format --check cyberbullying_api/

    - name: Run tests with pytest
      env:
        ENV: test
        API_KEY: test_api_key_for_ci_pipeline_run
        PG_URL: postgresql://cyber_user:cyber_password@localhost:5432/cyberbullying_db
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest cyberbullying_api/tests/ tests/ --cov=cyberbullying_api --cov-report=xml --cov-report=term-missing --cov-fail-under=40

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: coverage.xml
        flags: backend
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docker-smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -f cyberbullying_api/Dockerfile -t bullyguard-id:test .

    - name: Run container and health check
      env:
        ENV: test
        API_KEY: smoke_test_key_12345
      run: |
        docker run -d --name bullyguard-test \
          -p 8000:8000 \
          -e ENV=test \
          -e API_KEY=smoke_test_key_12345 \
          -e ALLOWED_ORIGINS=http://localhost:3000 \
          bullyguard-id:test
        sleep 20
        curl -sf http://localhost:8000/health || exit 1
        curl -sf http://localhost:8000/ || exit 1

    - name: Cleanup
      if: always()
      run: |
        docker stop bullyguard-test || true
        docker rm bullyguard-test || true

  frontend-build:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint code
      run: |
        cd frontend
        npm run lint

    - name: Run frontend unit tests
      run: |
        cd frontend
        npm run test

    - name: Build production bundle
      run: |
        cd frontend
        npm run build
