[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bullyguard-id"
version = "2.0.0"
description = "AI hybrid system for cyberbullying and hate speech detection in Indonesian text"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "openpyxl>=3.1.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "gradio>=3.35.0",
    "httpx>=0.24.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "playwright>=1.40.0",
    "matplotlib>=3.7.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "cryptography>=42.0.0",
    "sentence-transformers>=2.2.0",
    "celery>=5.3.0",
    "accelerate>=1.1.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.8.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B904", "E402", "SIM115", "B008", "SIM102", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests", "cyberbullying_api/tests"]
pythonpath = [".", "cyberbullying_api"]
addopts = "--cov=cyberbullying_api --cov-report=xml --cov-report=term-missing --cov-fail-under=40"
asyncio_mode = "auto"
