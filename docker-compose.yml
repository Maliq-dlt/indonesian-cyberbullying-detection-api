version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cyberbullying_pg
    restart: always
    environment:
      POSTGRES_USER: cyber_user
      POSTGRES_PASSWORD: cyber_password
      POSTGRES_DB: cyberbullying_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber_user -d cyberbullying_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cyberbullying_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --save 60 1 --loglevel warning

  api:
    build:
      context: .
      dockerfile: cyberbullying_api/Dockerfile
    container_name: cyberbullying_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PG_URL=postgresql://cyber_user:cyber_password@db:5432/cyberbullying_db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # Mount cache so models don't need redownloading if they exist
      - ./cyberbullying_api/models:/app/cyberbullying_api/models
      # Mount cookies for live scraping
      - ./cyberbullying_api/cookies_x.json:/app/cyberbullying_api/cookies_x.json
      - ./cyberbullying_api/cookies_tiktok.json:/app/cyberbullying_api/cookies_tiktok.json

  ui:
    build:
      context: .
      dockerfile: cyberbullying_api/Dockerfile
    container_name: cyberbullying_ui
    restart: always
    ports:
      - "7860:7860"
    command: python app_ui.py
    environment:
      - PG_URL=postgresql://cyber_user:cyber_password@db:5432/cyberbullying_db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./cyberbullying_api/models:/app/cyberbullying_api/models
      - ./cyberbullying_api/cookies_x.json:/app/cyberbullying_api/cookies_x.json
      - ./cyberbullying_api/cookies_tiktok.json:/app/cyberbullying_api/cookies_tiktok.json
      # Untuk bisa export CSV
      - .:/app

volumes:
  pgdata:
  redisdata:
