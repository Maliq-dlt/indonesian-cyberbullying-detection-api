services:
  db:
    image: pgvector/pgvector:pg15
    container_name: cyberbullying_pg
    restart: always
    environment:
      POSTGRES_USER: cyber_user
      POSTGRES_PASSWORD: cyber_password
      POSTGRES_DB: cyberbullying_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber_user -d cyberbullying_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cyberbullying_redis
    restart: always
    volumes:
      - redisdata:/data
    command: redis-server --save 60 1 --loglevel warning --requirepass cyber_redis_pass
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cyber_redis_pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: cyberbullying_api/Dockerfile
    container_name: cyberbullying_api
    restart: always
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PG_URL=postgresql://cyber_user:cyber_password@db:5432/cyberbullying_db
      - REDIS_URL=redis://:cyber_redis_pass@redis:6379/0
      - OLLAMA_URL=http://host.docker.internal:11434
      - HF_TOKEN=${HF_TOKEN}
      - ENV=development
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./cyberbullying_api:/app/cyberbullying_api
      # Mount cache so models don't need redownloading if they exist
      - ./cyberbullying_api/models:/app/cyberbullying_api/models
      # Mount cookies dan browser profile untuk live scraping
      - ./cyberbullying_api/cookies_x.json:/app/cyberbullying_api/cookies_x.json
      # Mount browser profile untuk sesi login TikTok (persistent context)
      - ./cyberbullying_api/tiktok_browser_profile:/app/cyberbullying_api/tiktok_browser_profile
      - cache_data:/app/cyberbullying_api/cache

  worker:
    build:
      context: .
      dockerfile: cyberbullying_api/Dockerfile
    container_name: cyberbullying_worker
    restart: always
    command: celery -A tasks worker --loglevel=info --concurrency=1
    environment:
      - PG_URL=postgresql://cyber_user:cyber_password@db:5432/cyberbullying_db
      - REDIS_URL=redis://:cyber_redis_pass@redis:6379/0
      - OLLAMA_URL=http://host.docker.internal:11434
      - HF_TOKEN=${HF_TOKEN}
      - ENV=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./cyberbullying_api:/app/cyberbullying_api
      - ./cyberbullying_api/models:/app/cyberbullying_api/models
      - ./cyberbullying_api/cookies_x.json:/app/cyberbullying_api/cookies_x.json
      - ./cyberbullying_api/tiktok_browser_profile:/app/cyberbullying_api/tiktok_browser_profile
      - cache_data:/app/cyberbullying_api/cache

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: cyberbullying_web
    restart: always
    command: npx vite --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  cache_data:

