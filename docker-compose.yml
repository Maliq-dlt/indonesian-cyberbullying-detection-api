services:
  db:
    image: pgvector/pgvector:pg15
    container_name: cyberbullying_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyber_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyber_password}
      POSTGRES_DB: ${POSTGRES_DB:-cyberbullying_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cyberbullying_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cyber_redis_pass}
    volumes:
      - redisdata:/data
    command: >
      sh -c 'redis-server --save 60 1 --loglevel warning --requirepass "$${REDIS_PASSWORD}"'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: cyberbullying_api/Dockerfile
      args:
        INSTALL_PLAYWRIGHT: "true"
    image: cyberbullying_api:latest
    container_name: cyberbullying_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      ENV: ${ENV:-development}
      API_KEY: ${API_KEY:-}
      ALLOW_MISSING_API_KEY_IN_DEV: ${ALLOW_MISSING_API_KEY_IN_DEV:-true}
      PG_URL: postgresql://${POSTGRES_USER:-cyber_user}:${POSTGRES_PASSWORD:-cyber_password}@db:5432/${POSTGRES_DB:-cyberbullying_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cyber_redis_pass}@redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      HF_TOKEN: ${HF_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-15}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-true}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./cyberbullying_api:/app/cyberbullying_api
      - ./cyberbullying_api/models:/app/cyberbullying_api/models
      - ./cyberbullying_api/cookies_x.json:/app/cyberbullying_api/cookies_x.json
      - ./cyberbullying_api/tiktok_browser_profile:/app/cyberbullying_api/tiktok_browser_profile
      - cache_data:/app/cyberbullying_api/cache

  worker:
    image: cyberbullying_api:latest
    container_name: cyberbullying_worker
    restart: unless-stopped
    command: celery -A tasks worker --loglevel=info --concurrency=1
    environment:
      ENV: ${ENV:-development}
      API_KEY: ${API_KEY:-}
      PG_URL: postgresql://${POSTGRES_USER:-cyber_user}:${POSTGRES_PASSWORD:-cyber_password}@db:5432/${POSTGRES_DB:-cyberbullying_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cyber_redis_pass}@redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      HF_TOKEN: ${HF_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./cyberbullying_api:/app/cyberbullying_api
      - ./cyberbullying_api/models:/app/cyberbullying_api/models
      - ./cyberbullying_api/cookies_x.json:/app/cyberbullying_api/cookies_x.json
      - ./cyberbullying_api/tiktok_browser_profile:/app/cyberbullying_api/tiktok_browser_profile
      - cache_data:/app/cyberbullying_api/cache

  web:
    image: node:20-alpine
    container_name: cyberbullying_web
    restart: unless-stopped
    working_dir: /app
    command: sh -c "if [ ! -d node_modules/vite ]; then npm ci; fi; npx vite --host 0.0.0.0 --port 3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api


volumes:
  pgdata:
  redisdata:
  cache_data:
  frontend_node_modules:
